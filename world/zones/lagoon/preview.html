<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Shallows — Zone 2 Preview</title>
<style>
  :root {
    --ink: #eaf6f4;
    --ink-dim: #9fc2c4;
    --panel: rgba(9, 22, 28, 0.66);
    --panel-solid: rgba(9, 22, 28, 0.92);
    --edge: rgba(120, 224, 224, 0.22);
    --accent: #4fe0d6;
    --accent-warm: #ffd08a;
    --font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04141b; }
  canvas { display: block; }

  /* underwater colour-grade overlay — sits over the canvas, under the HUD */
  #grade {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    mix-blend-mode: multiply; z-index: 5; transition: none;
  }

  /* click-to-look prompt */
  #lock-hint {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: opacity .25s ease;
  }
  #lock-hint .pill {
    font-family: var(--font); font-size: 13px; letter-spacing: .04em; color: var(--ink);
    background: var(--panel-solid); border: 1px solid var(--edge); border-radius: 999px;
    padding: 10px 18px; backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #lock-hint .pill b { color: var(--accent); font-weight: 600; }
  body.locked #lock-hint { opacity: 0; }

  /* HUD panel */
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10; width: 244px;
    font-family: var(--font); color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    backdrop-filter: blur(12px) saturate(1.1); box-shadow: 0 10px 40px rgba(0,0,0,.38);
    user-select: none;
  }
  #hud .hd {
    padding: 12px 14px 10px; border-bottom: 1px solid var(--edge);
  }
  #hud .hd .title { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  #hud .hd .sub { font-size: 10.5px; color: var(--ink-dim); margin-top: 3px; letter-spacing: .02em; }
  #hud .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 13px; }

  .sec-label { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }

  /* day/night slider */
  .dn-row { display: flex; align-items: center; gap: 8px; }
  #dn { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #ffe6b0, #7fd8e0 45%, #123a63 78%, #05101d); outline: none; }
  #dn::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(79,224,214,.6); }
  #dn::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--accent); cursor: pointer; }
  #dn-val { font-size: 10.5px; color: var(--accent-warm); width: 40px; text-align: right; }

  /* toggles */
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .tg { display: flex; align-items: center; gap: 7px; font-size: 11px; cursor: pointer; color: var(--ink); }
  .tg input { appearance: none; -webkit-appearance: none; width: 15px; height: 15px; border-radius: 4px;
    border: 1px solid var(--edge); background: rgba(255,255,255,.04); display: grid; place-content: center; cursor: pointer; margin: 0; }
  .tg input:checked { background: var(--accent); border-color: var(--accent); }
  .tg input:checked::after { content: ""; width: 6px; height: 6px; border-radius: 1px; background: #04141b; }

  /* view buttons */
  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .views button { font-family: var(--font); font-size: 10.5px; letter-spacing: .04em; color: var(--ink);
    background: rgba(255,255,255,.05); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 4px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease; }
  .views button:hover { background: rgba(79,224,214,.16); border-color: var(--accent); }

  /* readout */
  #readout { font-size: 10.5px; line-height: 1.65; color: var(--ink-dim); }
  #readout .row { display: flex; justify-content: space-between; gap: 10px; }
  #readout .v { color: var(--ink); }
  #readout .zone { font-weight: 600; letter-spacing: .04em; }
  #readout .below { color: var(--accent); }
  #readout .above { color: var(--accent-warm); }

  #help { position: fixed; bottom: 12px; left: 14px; z-index: 10; font-family: var(--font);
    font-size: 10px; color: rgba(200,230,230,.5); letter-spacing: .03em; }
  #help b { color: rgba(200,230,230,.8); font-weight: 600; }
</style>
</head>
<body>
  <div id="grade"></div>

  <div id="lock-hint"><div class="pill"><b>Click</b> to look around · <b>WASD</b> move · <b>Q/E</b> down/up · <b>Shift</b> boost</div></div>

  <div id="hud">
    <div class="hd">
      <div class="title">The Shallows</div>
      <div class="sub">Zone 2 · a sunken archipelago</div>
    </div>
    <div class="body">
      <div>
        <div class="sec-label">Time of day</div>
        <div class="dn-row">
          <input id="dn" type="range" min="0" max="1" step="0.01" value="0" />
          <span id="dn-val">Morning</span>
        </div>
      </div>

      <div>
        <div class="sec-label">Views</div>
        <div class="views">
          <button data-view="boat">Boat</button>
          <button data-view="shore">Shore</button>
          <button data-view="aerial">Aerial</button>
          <button data-view="lagoon">Lagoon</button>
          <button data-view="dive">Dive</button>
          <button data-view="drop">The Drop</button>
        </div>
      </div>

      <div>
        <div class="sec-label">FX layers</div>
        <div class="toggles" id="toggles"></div>
      </div>

      <div>
        <div class="sec-label">Readout</div>
        <div id="readout">
          <div class="row"><span>pos</span><span class="v" id="r-pos">–</span></div>
          <div class="row"><span>seabed</span><span class="v" id="r-bed">–</span></div>
          <div class="row"><span>state</span><span class="v" id="r-state">–</span></div>
          <div class="row"><span>fps</span><span class="v" id="r-fps">–</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="help"><b>The Shallows</b> — free-fly preview · dive below the surface for the underwater view</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    // Standalone harness: talks directly to the pure-data terrain module +
    // createLagoon, same as before — it never goes through the Zone-contract
    // wrapper (./zone.js), which normalizes spawnPoints for the shell's
    // generic placement logic and would lose the richer {position,lookAt}
    // shape this harness's view buttons need. `import * as zone` gives a
    // namespace object with the same property access the original bundled
    // zone object had (zone.WATER_Y, zone.terrainHeight, zone.spawnPoints, ...).
    import * as zone from './terrain.js';
    import { createLagoon } from './lagoon-fx.js';

    // ── renderer / scene / camera ────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 420);

    // ── the zone ──────────────────────────────────────────────────────────────
    // No opts — createLagoon falls back to owning its own local hemi/sun,
    // exactly as before this module supported the shell's shared-lights path.
    const lagoon = createLagoon(zone);
    lagoon.attach(scene);
    lagoon.setOverlay(document.getElementById('grade'));

    // Rendered directly (no post stack). Night bioluminescence comes from the
    // flora's in-shader emissive glow rather than a bloom pass — keeps it cheap
    // and robust, per the brief's "don't build a heavy post stack".

    // ── free-fly controls ──────────────────────────────────────────────────---
    const controls = new PointerLockControls(camera, renderer.domElement);
    renderer.domElement.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => document.body.classList.add('locked'));
    controls.addEventListener('unlock', () => document.body.classList.remove('locked'));

    const keys = new Set();
    addEventListener('keydown', (e) => { keys.add(e.code); });
    addEventListener('keyup', (e) => { keys.delete(e.code); });

    const UP = new THREE.Vector3(0, 1, 0);
    const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
    const BASE_SPEED = 15;

    function fly(dt) {
      camera.getWorldDirection(fwd);
      right.crossVectors(fwd, UP).normalize();
      move.set(0, 0, 0);
      if (keys.has('KeyW')) move.add(fwd);
      if (keys.has('KeyS')) move.sub(fwd);
      if (keys.has('KeyD')) move.add(right);
      if (keys.has('KeyA')) move.sub(right);
      if (keys.has('KeyE')) move.y += 1;
      if (keys.has('KeyQ')) move.y -= 1;
      if (move.lengthSq() > 0) {
        move.normalize();
        const spd = BASE_SPEED * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.2 : 1) * dt;
        camera.position.addScaledVector(move, spd);
      }
    }

    // ── views ─────────────────────────────────────────────────────────────────
    const VIEWS = {
      boat:   { pos: zone.spawnPoints.boat.position,  look: zone.spawnPoints.boat.lookAt },
      shore:  { pos: zone.spawnPoints.shore.position, look: zone.spawnPoints.shore.lookAt },
      aerial: { pos: [4, 78, 62],   look: [0, -6, -4] },
      lagoon: { pos: [-2, 6, 40],   look: [0, -3, 0] },
      dive:   { pos: [7, -1.9, -1], look: [-6, -3.4, 26] },
      drop:   { pos: [6, -1.6, 12], look: [-2, -8, 34] },
    };
    function setView(name) {
      const v = VIEWS[name]; if (!v) return;
      camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
      camera.lookAt(v.look[0], v.look[1], v.look[2]);
    }
    document.querySelectorAll('.views button').forEach((b) =>
      b.addEventListener('click', () => { setView(b.dataset.view); b.blur(); }));
    setView('lagoon');

    // ── day/night slider ────────────────────────────────────────────────────--
    const dn = document.getElementById('dn'), dnVal = document.getElementById('dn-val');
    function dnLabel(t) { return t < 0.17 ? 'Morning' : t < 0.5 ? 'Afternoon' : t < 0.8 ? 'Dusk' : t < 0.95 ? 'Night' : 'Deep night'; }
    dn.addEventListener('input', () => {
      const t = parseFloat(dn.value);
      lagoon.setDayNight(t);
      dnVal.textContent = dnLabel(t);
    });

    // ── fx toggles ──────────────────────────────────────────────────────────--
    const LAYERS = [
      ['water', 'Water'], ['caustics', 'Caustics'], ['godrays', 'God rays'],
      ['motes', 'Motes'], ['bubbles', 'Bubbles'], ['flora', 'Flora'],
      ['terrain', 'Terrain'], ['glow', 'Night glow'],
    ];
    const tgWrap = document.getElementById('toggles');
    LAYERS.forEach(([id, label]) => {
      const l = document.createElement('label'); l.className = 'tg';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.dataset.layer = id;
      cb.addEventListener('change', () => { lagoon.setLayerEnabled(id, cb.checked); });
      l.appendChild(cb); l.appendChild(document.createTextNode(label));
      tgWrap.appendChild(l);
    });

    // ── readout ─────────────────────────────────────────────────────────────--
    const rPos = document.getElementById('r-pos'), rBed = document.getElementById('r-bed'),
          rState = document.getElementById('r-state'), rFps = document.getElementById('r-fps');
    let fps = 60, fpsAcc = 0, fpsN = 0, fpsT = 0;
    function readout() {
      const p = camera.position;
      rPos.textContent = `${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
      const bed = zone.terrainHeight(p.x, p.z);
      const depth = zone.WATER_Y - bed;
      rBed.textContent = `${bed.toFixed(1)}  (${depth > 0 ? depth.toFixed(1) + 'u deep' : 'land'})`;
      const below = p.y < zone.WATER_Y;
      rState.innerHTML = below
        ? `<span class="zone below">BELOW · ${(zone.WATER_Y - p.y).toFixed(1)}u under</span>`
        : `<span class="zone above">ABOVE · ${(p.y - zone.WATER_Y).toFixed(1)}u up</span>`;
      rFps.textContent = fps.toFixed(0);
    }

    // ── resize ─────────────────────────────────────────────────────────────---
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── loop ────────────────────────────────────────────────────────────────--
    const clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame); // schedule first so a thrown error can never kill the loop
      const dt = Math.min(clock.getDelta(), 0.05);
      try {
        fly(dt);
        lagoon.update(dt, camera);
        renderer.render(scene, camera);
        fpsAcc += dt; fpsN++;
        if (fpsAcc - fpsT > 0.35) { fps = fpsN / (fpsAcc - fpsT); fpsT = fpsAcc; fpsN = 0; }
        readout();
      } catch (err) { showErr('frame: ' + err.message); }
    }
    frame();
    // force one synchronous frame (verification aid for when background rAF is throttled)
    window.__renderNow = () => { lagoon.update(1 / 60, camera); renderer.render(scene, camera); readout(); };

    // expose for console poking
    window.__lagoon = { zone, lagoon, camera, scene, renderer, setView };

    // surface any runtime error on-screen (debug)
    function showErr(msg) { const h = document.getElementById('help'); if (h) h.innerHTML = '<b style="color:#ff8080">ERR</b> ' + msg; }
    addEventListener('error', (e) => showErr(e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    addEventListener('unhandledrejection', (e) => showErr('promise: ' + (e.reason && e.reason.message || e.reason)));
  </script>
</body>
</html>
