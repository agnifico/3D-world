<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;font:13px monospace;background:#222;color:#dfd}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script></head><body><pre id="out">loading…</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const out = document.getElementById('out');
try {
  // const gltf = await new GLTFLoader().loadAsync('uploads/natural_girl_02.glb');
  const gltf = await new GLTFLoader().loadAsync('uploads/natural_girl.glb');
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  const lines = [];
  lines.push('size: ' + size.x.toFixed(3) + ' x ' + size.y.toFixed(3) + ' x ' + size.z.toFixed(3));
  lines.push('min.y: ' + box.min.y.toFixed(3));
  lines.push('animations: ' + gltf.animations.map(a => a.name + ' (' + a.duration.toFixed(2) + 's)').join(', '));
  let meshes = 0, skinned = 0, tris = 0, mats = new Set(), textured = 0;
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      meshes++; if (o.isSkinnedMesh) skinned++;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(mm => { mats.add(mm.name || mm.uuid); if (mm.map) textured++; });
    }
  });
  lines.push(`meshes: ${meshes} (skinned ${skinned}), tris ~${Math.round(tris)}, materials: ${[...mats].join(', ')}, textured meshes: ${textured}`);
  out.textContent = lines.join('\n');
} catch (e) { out.textContent = 'ERROR: ' + e.message; }
</script></body></html>
